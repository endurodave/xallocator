name: RTOS Locks

# Compiles xallocator.cpp for Cortex-M4 with each RTOS lock option against the
# real vendor headers (compile only: no link, no run). XALLOC_LOCK_FREERTOS is
# built and run by the PlatformIO workflow (env:disco_f407vg) instead.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least privilege for GITHUB_TOKEN: these jobs only check out code.
permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.lock }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        lock: [XALLOC_LOCK_THREADX, XALLOC_LOCK_CMSIS_RTOS2, XALLOC_LOCK_USER, XALLOC_LOCK_NONE]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install ARM GCC toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    # Only the headers the lock needs, from the upstream repositories
    - name: Fetch RTOS headers
      run: |
        mkdir -p /tmp/threadx /tmp/cmsis
        curl -sfL -o /tmp/threadx/tx_api.h \
          https://raw.githubusercontent.com/eclipse-threadx/threadx/master/common/inc/tx_api.h
        curl -sfL -o /tmp/threadx/tx_port.h \
          https://raw.githubusercontent.com/eclipse-threadx/threadx/master/ports/cortex_m4/gnu/inc/tx_port.h
        curl -sfL -o /tmp/cmsis/cmsis_compiler.h \
          https://raw.githubusercontent.com/ARM-software/CMSIS_5/develop/CMSIS/Core/Include/cmsis_compiler.h
        curl -sfL -o /tmp/cmsis/cmsis_gcc.h \
          https://raw.githubusercontent.com/ARM-software/CMSIS_5/develop/CMSIS/Core/Include/cmsis_gcc.h

    # Heap blocks and static pools modes. -D__PROGRAM_START=1: cmsis_gcc.h's
    # default startup code needs -fpermissive on newer GCC; a real target
    # supplies its own startup code.
    - name: Compile
      run: |
        for mode in "" "-DSTATIC_POOLS"; do
          arm-none-eabi-g++ xallocator.cpp Allocator.cpp \
            -mcpu=cortex-m4 -mthumb -mfpu=fpv4-sp-d16 -mfloat-abi=hard \
            -std=gnu++11 -c -O2 -Wall -Wextra -Werror --specs=nano.specs -fno-exceptions \
            -D${{ matrix.lock }} -D__PROGRAM_START=1 $mode \
            -I /tmp/threadx -I /tmp/cmsis
        done
